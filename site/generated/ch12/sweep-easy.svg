<svg class="regret-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" role="img" aria-labelledby="rc-title rc-desc">
<title id="rc-title">Regret with 4 replicas by sync interval</title>
<desc id="rc-desc">Mean final regret over 40 seeds on the &#34;easy&#34; scenario, 5000 steps.</desc>
<style>
.regret-chart:not([data-embedded]){--surface:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--grid:#e4e3df;--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--series-4:#eda100}
.regret-chart{font-family:system-ui,sans-serif}
@media (prefers-color-scheme:dark){.regret-chart:not([data-embedded]){--surface:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#34342f;--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--series-4:#c98500}}
.regret-chart .bg{fill:var(--surface)}
.regret-chart .grid{stroke:var(--grid);stroke-width:1}
.regret-chart .axis{stroke:var(--ink2);stroke-width:1}
.regret-chart text{fill:var(--ink2);font-size:12px}
.regret-chart .title{fill:var(--ink);font-size:14px;font-weight:600}
.regret-chart .line{fill:none;stroke-width:2;stroke-linejoin:round}
.regret-chart .band{stroke:none;opacity:.18}
.regret-chart .label{fill:var(--ink);font-size:12px}
</style>
<rect class="bg" width="780" height="400"/>
<text class="title" x="64" y="24">Final regret · 4 replicas · easy · mean of 40 seeds</text>
<line class="grid" x1="64" x2="604" y1="352.0" y2="352.0"/>
<text x="56" y="352.0" text-anchor="end" dominant-baseline="middle">0</text>
<line class="grid" x1="64" x2="604" y1="275.0" y2="275.0"/>
<text x="56" y="275.0" text-anchor="end" dominant-baseline="middle">50</text>
<line class="grid" x1="64" x2="604" y1="198.0" y2="198.0"/>
<text x="56" y="198.0" text-anchor="end" dominant-baseline="middle">100</text>
<line class="grid" x1="64" x2="604" y1="121.0" y2="121.0"/>
<text x="56" y="121.0" text-anchor="end" dominant-baseline="middle">150</text>
<line class="grid" x1="64" x2="604" y1="44.0" y2="44.0"/>
<text x="56" y="44.0" text-anchor="end" dominant-baseline="middle">200</text>
<text x="64.0" y="372" text-anchor="middle">never</text>
<text x="199.0" y="372" text-anchor="middle">1000</text>
<text x="334.0" y="372" text-anchor="middle">100</text>
<text x="469.0" y="372" text-anchor="middle">10</text>
<text x="604.0" y="372" text-anchor="middle">1</text>
<line class="axis" x1="64" x2="604" y1="352.0" y2="352.0"/>
<text x="334.0" y="392" text-anchor="middle">steps between syncs</text>
<polyline class="line" stroke="var(--series-1)" points="64.0,77.4 199.0,78.1 334.0,102.7 469.0,112.1 604.0,107.6"/>
<circle cx="64.0" cy="77.4" r="3.5" fill="var(--series-1)"/>
<circle cx="199.0" cy="78.1" r="3.5" fill="var(--series-1)"/>
<circle cx="334.0" cy="102.7" r="3.5" fill="var(--series-1)"/>
<circle cx="469.0" cy="112.1" r="3.5" fill="var(--series-1)"/>
<circle cx="604.0" cy="107.6" r="3.5" fill="var(--series-1)"/>
<polyline class="line" stroke="var(--series-2)" stroke-dasharray="6 4" points="64.0,88.6 199.0,220.2 334.0,250.4 469.0,254.0 604.0,255.9"/>
<circle cx="64.0" cy="88.6" r="3.5" fill="var(--series-2)"/>
<circle cx="199.0" cy="220.2" r="3.5" fill="var(--series-2)"/>
<circle cx="334.0" cy="250.4" r="3.5" fill="var(--series-2)"/>
<circle cx="469.0" cy="254.0" r="3.5" fill="var(--series-2)"/>
<circle cx="604.0" cy="255.9" r="3.5" fill="var(--series-2)"/>
<polyline class="line" stroke="var(--series-3)" points="64.0,294.4 199.0,308.1 334.0,328.1 469.0,333.2 604.0,334.8"/>
<circle cx="64.0" cy="294.4" r="3.5" fill="var(--series-3)"/>
<circle cx="199.0" cy="308.1" r="3.5" fill="var(--series-3)"/>
<circle cx="334.0" cy="328.1" r="3.5" fill="var(--series-3)"/>
<circle cx="469.0" cy="333.2" r="3.5" fill="var(--series-3)"/>
<circle cx="604.0" cy="334.8" r="3.5" fill="var(--series-3)"/>
<text class="label" x="612" y="107.6" dominant-baseline="middle"><tspan fill="var(--series-1)">●</tspan> epsgreedy:0.1</text>
<text class="label" x="612" y="255.9" dominant-baseline="middle"><tspan fill="var(--series-2)">●</tspan> ucb1</text>
<text class="label" x="612" y="334.8" dominant-baseline="middle"><tspan fill="var(--series-3)">●</tspan> thompson</text>
</svg>
